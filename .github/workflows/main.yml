name: Validar y simular un deploy

on:
  push:
    branches: ["main"]
permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar repositorio
        uses: actions/checkout@v4
      - name: "PASO 1 Estructura de carpeta"
        uses: |
          test -d app
          test -f app/index.php
          test -f Dockerfile
          test -f docker-compose.yml
      - name: "construccion"
        uses:  docker compose build
